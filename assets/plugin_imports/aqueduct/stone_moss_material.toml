resolution = 1024
normal_format = "opengl"

outputs = { "ao" = "stone_ao", "base_color" = "stone_moss_blend", "height" = "stone_height", "normal" = "stone_normal", "roughness" = "stone_roughness" }

output_positions = { "ao" = [16, 16], "base_color" = [16, 0], "height" = [16, 4], "normal" = [16, 8], "roughness" = [16, 12] }

[nodes."stone_height"]
kind = "fractal_sum"
params = { "basis" = "simplex", "disorder" = 0.28, "disorder_speed" = 1.0, "mode" = "hybrid_multifractal", "octaves" = 5.8, "offset" = [0.13, -0.21], "roughness" = 0.64, "scale" = 8 }
position = [0, 0]
seed = 31

[nodes."stone_dark"]
kind = "uniform_color"
params = { "color" = [0.035, 0.075, 0.068, 1.0], "luminance" = 0.5, "mode" = "color" }
position = [0, 5]

[nodes."moss_noise"]
kind = "fractal_sum"
params = { "basis" = "simplex", "disorder" = 0.28, "disorder_speed" = 1.0, "mode" = "fbm", "octaves" = 3.8, "offset" = [0.29, -0.17], "roughness" = 0.62, "scale" = 4 }
position = [0, 22]
seed = 72

[nodes."stone_light"]
kind = "uniform_color"
params = { "color" = [0.27, 0.37, 0.29, 1.0], "luminance" = 0.5, "mode" = "color" }
position = [4, 5]

[nodes."moss_mask"]
kind = "threshold"
inputs = { "input" = "moss_noise.output" }
params = { "mode" = "greater", "threshold" = 0.64 }
position = [4, 22]

[nodes."moss_color"]
kind = "uniform_color"
params = { "color" = [0.18, 0.28, 0.2, 1.0], "luminance" = 0.5, "mode" = "color" }
position = [8, 22]

[nodes."stone_blend"]
kind = "blend"
inputs = { "background" = "stone_dark.output", "foreground" = "stone_light.output", "opacity_map" = "stone_height.output" }
params = { "alpha_blending" = "ignore_alpha", "mode" = "copy", "opacity" = 0.82 }
position = [10, 3]

[nodes."stone_normal"]
kind = "normal"
inputs = { "input" = "stone_height.output" }
params = { "format" = "opengl", "intensity" = 2.9 }
position = [10, 8]

[nodes."stone_roughness"]
kind = "levels"
inputs = { "input" = "stone_height.output" }
params = { "in_high" = 1.0, "in_low" = 0.0, "midtone" = 0.5, "out_high" = 0.94, "out_low" = 0.68 }
position = [10, 12]

[nodes."stone_ao"]
kind = "ambient_occlusion_gtao"
inputs = { "input" = "stone_height.output" }
params = { "height_depth" = 0.35, "intensity" = 1.0, "radius" = 0.08 }
position = [10, 16]

[nodes."stone_moss_blend"]
kind = "blend"
inputs = { "background" = "stone_blend.output", "foreground" = "moss_color.output", "opacity_map" = "moss_mask.output" }
params = { "alpha_blending" = "ignore_alpha", "mode" = "copy", "opacity" = 0.32 }
position = [12, 3]
