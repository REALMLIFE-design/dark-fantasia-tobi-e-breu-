name: Extrair projeto Godot para o repositório

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extrair-projeto.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extrair-projeto-godot
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extrair projeto Godot
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="TobiEBreu-PBR-Ajustes-Biomas-v0.18(1).zip"
          test -f "$ZIP_FILE" || { echo "::error::Arquivo ZIP não encontrado: $ZIP_FILE"; exit 1; }
          WORK_DIR="$RUNNER_TEMP/tobi-extract"
          mkdir -p "$WORK_DIR"
          unzip -q "$ZIP_FILE" -d "$WORK_DIR"
          PROJECT_FILE="$(find "$WORK_DIR" -type f -name project.godot -print -quit)"
          test -n "$PROJECT_FILE" || { echo "::error::Não encontrei project.godot dentro do ZIP."; exit 1; }
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "Projeto encontrado em: $PROJECT_DIR"
          rsync -a             --exclude='.git/'             --exclude='.github/'             "$PROJECT_DIR/" ./
          test -f project.godot || { echo "::error::A extração não colocou project.godot na raiz."; exit 1; }

      - name: Salvar arquivos extraídos no GitHub
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
          else
            git commit -m "Extrai projeto Godot do arquivo ZIP"
            git push
          fi
