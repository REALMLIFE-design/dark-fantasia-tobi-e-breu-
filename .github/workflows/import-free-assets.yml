name: Importar modelos 3D e texturas gratuitos

on:
  push:
    branches:
      - integration/definitive-all-versions
    paths:
      - '.github/workflows/import-free-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: free-assets-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  download-and-integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
        with:
          ref: integration/definitive-all-versions
          fetch-depth: 0
      - name: Preparar ferramentas
        run: python -m pip install --disable-pip-version-check gdown requests
      - name: Baixar modelos 3D CC0 do Quaternius
        run: |
          set -euo pipefail
          mkdir -p /tmp/quaternius assets/external_packs/quaternius_stylized_nature
          gdown --folder 'https://drive.google.com/drive/folders/1IV3bXHzkNvuNWFHPi4KPx-G4ghuxIuT-' -O /tmp/quaternius --remaining-ok
          find /tmp/quaternius -type f -iname '*.zip' -print0 | while IFS= read -r -d '' archive; do
            mkdir -p "${archive%.zip}"
            unzip -oq "$archive" -d "${archive%.zip}"
          done
          find /tmp/quaternius -type f \( -iname '*.glb' -o -iname '*.gltf' -o -iname '*.fbx' \) -print0 | while IFS= read -r -d '' model; do
            cp "$model" "assets/external_packs/quaternius_stylized_nature/$(basename "$model")"
          done
          MODEL_COUNT=$(find assets/external_packs/quaternius_stylized_nature -type f \( -iname '*.glb' -o -iname '*.gltf' -o -iname '*.fbx' \) | wc -l)
          echo "Modelos 3D copiados: $MODEL_COUNT"
          if [ "$MODEL_COUNT" -eq 0 ]; then echo '::error::O download não trouxe arquivos GLB, GLTF ou FBX.'; exit 1; fi
      - name: Baixar materiais PBR CC0 do Poly Haven
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, requests
          headers = {"User-Agent": "TobiEBreuDarkWorld3D/1.0 (free game asset import)"}
          materials = {"aerial_grass_rock":"pedra_musgo", "aerial_ground_rock":"terra_pedras", "aerial_mud_1":"lama"}
          for asset_id, folder in materials.items():
              response = requests.get(f"https://api.polyhaven.com/files/{asset_id}", headers=headers, timeout=60)
              response.raise_for_status()
              files = response.json()
              target = pathlib.Path("assets/textures/polyhaven") / folder
              target.mkdir(parents=True, exist_ok=True)
              for channel, filename in (("Diffuse","albedo"),("nor_gl","normal"),("Rough","roughness")):
                  try: url = files[channel]["1k"]["jpg"]["url"]
                  except (KeyError, TypeError): print(f"Canal {channel} indisponível: {asset_id}"); continue
                  data = requests.get(url, headers=headers, timeout=120)
                  data.raise_for_status()
                  (target / f"{filename}.jpg").write_bytes(data.content)
                  print(f"Baixado {asset_id}: {channel} ({len(data.content)} bytes)")
          PY
      - name: Registrar licenças e fontes
        run: |
          cat > assets/external_packs/QUATERNIUS-POLYHAVEN-LICENSES.md <<'EOF'
          # Fontes dos assets importados automaticamente
          ## Quaternius — Ultimate Stylized Nature (60+)
          - Origem: https://www.patreon.com/quaternius/posts/ultimate-nature-67157089
          - Licença declarada pelo autor: CC0; uso pessoal e comercial permitido.
          - Modelos copiados para assets/external_packs/quaternius_stylized_nature/.
          ## Poly Haven
          - API: https://api.polyhaven.com
          - Materiais: Aerial Grass Rock, Aerial Ground Rock e Aerial Mud 1.
          - Licença dos assets: CC0. API gratuita, sem chave.
          - Fonte: https://polyhaven.com/our-api
          EOF
      - name: Commitir assets baixados
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/external_packs/quaternius_stylized_nature assets/textures/polyhaven assets/external_packs/QUATERNIUS-POLYHAVEN-LICENSES.md
          if git diff --cached --quiet; then echo 'Nenhum asset novo.'; exit 0; fi
          git commit -m 'Importa modelos 3D Quaternius e materiais PBR Poly Haven'
          git push origin HEAD:integration/definitive-all-versions