name: Importar personagem Tobi modular — Quaternius CC0

on:
  push:
    branches: [integration/definitive-all-versions]
    paths:
      - '.github/workflows/import-tobi-quaternius.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tobi-quaternius-import
  cancel-in-progress: false

jobs:
  import-character:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
        with:
          ref: integration/definitive-all-versions
          fetch-depth: 0

      - name: Baixar ZIPs oficiais gratuitos e extrair apenas as peças do Tobi
        run: |
          set -euo pipefail
          python - <<'PY'
          import concurrent.futures, hashlib, json, pathlib, requests, zipfile
          from urllib.parse import unquote

          # Links temporários gerados pelo download gratuito Standard no itch.io.
          archives = {
              "base": (
                  "https://quaternius.itch.io/universal-base-characters/download/eyJleHBpcmVzIjoxNzk1Mzc2MzY1LCJpZCI6MzgyMjI1OX0%3D.C6eJM0ikIwKzbG%2FtqeKX2kDKWYY%3D",
                  "/tmp/Universal-Base-Characters-Standard.zip",
              ),
              "ranger": (
                  "https://quaternius.itch.io/modular-character-outfits-fantasy/download/eyJleHBpcmVzIjoxNzk1Mzc2MzY4LCJpZCI6NDA0MDM3OH0%3D.2NfwGJtVpt4OJ7s5CXQvGR4Z8%2FQ%3D",
                  "/tmp/Modular-Character-Outfits-Fantasy-Standard.zip",
              ),
          }
          wanted = {
              "base": ["Regular_Male_OnlyHead.gltf"],
              "ranger": [
                  "Male_Ranger_Body.gltf",
                  "Male_Ranger_Arms.gltf",
                  "Male_Ranger_Legs.gltf",
                  "Male_Ranger_Feet_Boots.gltf",
                  "Male_Ranger_Head_Hood.gltf",
              ],
          }
          output = pathlib.Path("assets/models/tobi_quaternius")
          output.mkdir(parents=True, exist_ok=True)
          session = requests.Session()
          session.headers.update({"User-Agent": "TobiEBreuDarkWorld3D/1.0"})

          def download(item):
              group, (url, path) = item
              target = pathlib.Path(path)
              with session.get(url, stream=True, allow_redirects=True, timeout=(30, 300)) as response:
                  response.raise_for_status()
                  with target.open("wb") as f:
                      for chunk in response.iter_content(chunk_size=1024 * 1024):
                          if chunk:
                              f.write(chunk)
              if not zipfile.is_zipfile(target):
                  raise RuntimeError(f"Download não é ZIP válido: {group}; final URL={response.url}")
              print(f"ZIP oficial baixado: {group}, {target.stat().st_size} bytes")
              return group, target

          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
              downloaded = dict(pool.map(download, archives.items()))

          manifest = []
          for group, model_names in wanted.items():
              archive_path = downloaded[group]
              target_dir = output / group
              target_dir.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(archive_path) as z:
                  names = z.namelist()
                  for model_name in model_names:
                      candidates = [n for n in names if pathlib.PurePosixPath(n).name == model_name]
                      if not candidates:
                          raise RuntimeError(f"Modelo ausente no ZIP {group}: {model_name}")
                      def score(path):
                          p = path.lower()
                          return (10 if "godot-unreal" in p else 0) + (5 if "godot" in p else 0) - (20 if "source" in p else 0) - (2 if "blender" in p else 0)
                      gltf_path = sorted(candidates, key=score, reverse=True)[0]
                      doc = json.loads(z.read(gltf_path).decode("utf-8"))
                      (target_dir / model_name).write_bytes(z.read(gltf_path))
                      dependencies = []
                      for entry in doc.get("buffers", []) + doc.get("images", []):
                          uri = entry.get("uri")
                          if not uri or uri.startswith("data:"):
                              continue
                          uri_path = unquote(uri.split("?")[0])
                          expected = pathlib.PurePosixPath(gltf_path).parent / uri_path
                          if expected.as_posix() in names:
                              dep_path = expected.as_posix()
                          else:
                              matches = [n for n in names if pathlib.PurePosixPath(n).name == pathlib.PurePosixPath(uri_path).name]
                              if not matches:
                                  raise RuntimeError(f"Dependência {uri} ausente para {gltf_path}")
                              dep_path = matches[0]
                          dep_name = pathlib.PurePosixPath(uri_path).name
                          data = z.read(dep_path)
                          dest = target_dir / dep_name
                          if dest.exists() and dest.read_bytes() != data:
                              raise RuntimeError(f"Conflito de textura com mesmo nome: {dep_name}")
                          dest.write_bytes(data)
                          dependencies.append((dep_name, data))
                      # Confere o tamanho real de cada buffer, não apenas sua existência.
                      for buffer in doc.get("buffers", []):
                          uri = buffer.get("uri")
                          if uri and not uri.startswith("data:"):
                              actual = (target_dir / pathlib.PurePosixPath(unquote(uri)).name).stat().st_size
                              if actual != buffer["byteLength"]:
                                  raise RuntimeError(f"Buffer incompleto em {model_name}: {actual} != {buffer['byteLength']}")
                      print(f"Extraído {group}/{model_name} de {gltf_path}; {len(dependencies)} dependências")
              for file in sorted(target_dir.iterdir()):
                  if file.is_file() and file.name not in ("README.md",):
                      data = file.read_bytes()
                      if file.suffix == ".bin" and data.startswith(b"version https://git-lfs.github.com/spec/v1"):
                          raise RuntimeError(f"Foi encontrado ponteiro Git LFS no lugar de binário: {file}")
                      if file.suffix == ".png" and not data.startswith(b"\x89PNG\r\n\x1a\n"):
                          raise RuntimeError(f"Textura PNG inválida: {file}")
                      manifest.append({
                          "group": group,
                          "file": file.name,
                          "bytes": len(data),
                          "sha256": hashlib.sha256(data).hexdigest(),
                      })

          # Verifica todas as referências dos glTFs no destino final.
          for gltf in output.rglob("*.gltf"):
              doc = json.loads(gltf.read_text(encoding="utf-8"))
              refs = [x.get("uri") for x in doc.get("buffers", []) + doc.get("images", []) if x.get("uri") and not x["uri"].startswith("data:")]
              missing = [r for r in refs if not (gltf.parent / pathlib.PurePosixPath(unquote(r)).name).is_file()]
              if missing:
                  raise RuntimeError(f"Dependências ausentes em {gltf}: {missing}")
          if len(list(output.rglob("*.gltf"))) != 6:
              raise RuntimeError("A montagem deve conter exatamente 6 modelos glTF.")

          (output / "ASSET-MANIFEST.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")
          (output / "SOURCES-LICENSE.md").write_text("""# Fontes e licenças do Tobi modular

          - Universal Base Characters — Quaternius: https://quaternius.itch.io/universal-base-characters
          - Modular Character Outfits - Fantasy — Quaternius: https://quaternius.itch.io/modular-character-outfits-fantasy
          - Ambos os pacotes Standard declaram CC0 1.0 nas páginas oficiais; uso e modificação permitidos, inclusive em jogos comerciais.
          - Os ZIPs oficiais gratuitos foram baixados diretamente do itch.io; somente os arquivos glTF, buffers e texturas necessários ao Tobi foram extraídos.
          - Peças usadas: cabeça base Regular Male OnlyHead + Ranger Body, Arms, Legs, Boots e Hood.
          """, encoding="utf-8")
          print(f"Extração validada: {len(manifest)} arquivos, {sum(x['bytes'] for x in manifest)} bytes.")
          PY

      - name: Commitar somente os arquivos reais do Tobi
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/models/tobi_quaternius
          if git diff --cached --quiet; then
            echo 'Nenhum arquivo novo para importar.'
            exit 0
          fi
          git commit -m 'Substitui ponteiros por modelos e texturas Quaternius reais'
          git pull --rebase origin integration/definitive-all-versions
          git push origin HEAD:integration/definitive-all-versions
