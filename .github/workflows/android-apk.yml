
name: Build Tobi e Breu APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado"
            exit 1
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Extrair projeto
        run: |
          mkdir extracted
          unzip -q TobiEBreu-PBR-Ajustes-Biomas-v0.18.zip -d extracted

          PROJECT_FILE=$(find extracted -name project.godot -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERRO: project.godot não encontrado"
            exit 1
          fi

          echo "PROJECT_PATH=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Exportar APK com Godot
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3.3-stable/Godot_v4.3.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3.3-stable/Godot_v4.3.3-stable_export_templates.tpz
          relative_project_path: ${{ env.PROJECT_PATH }}

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: TobiEBreu-APK
          path: ${{ env.PROJECT_PATH }}/build/TobiEBreu.apk
          if-no-files-found: error
