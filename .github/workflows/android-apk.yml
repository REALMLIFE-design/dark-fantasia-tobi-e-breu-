
name: Build Tobi e Breu APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir extracted
          unzip -q TobiEBreu-PBR-Ajustes-Biomas-v0.18.zip -d extracted
          PROJECT_FILE=$(find extracted -name project.godot -print -quit)
          if [ -z "$PROJECT_FILE" ]; then
            echo "project.godot not found"
            exit 1
          fi
          echo "PROJECT_PATH=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Export APK
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3.3-stable/Godot_v4.3.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3.3-stable/Godot_v4.3.3-stable_export_templates.tpz
          relative_project_path: ${{ env.PROJECT_PATH }}
          presets_to_export: Android
          export_debug: true
          use_preset_export_path: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TobiEBreu-APK
          path: ${{ env.PROJECT_PATH }}/build/TobiEBreu.apk
          if-no-files-found: error
          retention-days: 14
