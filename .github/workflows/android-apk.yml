
name: Build Tobi e Breu APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Extrair projeto
        run: |
          mkdir extracted
          unzip -q TobiEBreu-PBR-Ajustes-Biomas-v0.18.zip -d extracted

          PROJECT_FILE=$(find extracted -name project.godot -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERRO: project.godot não encontrado"
            exit 1
          fi

          echo "PROJECT_PATH=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Corrigir preset Android
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["PROJECT_PATH"]) / "export_presets.cfg"

          if not path.exists():
              raise SystemExit("ERRO: export_presets.cfg não encontrado")

          content = path.read_text(encoding="utf-8")

          content, count = re.subn(
              r'(?m)^(\s*gradle_build/use_gradle_build\s*=\s*)false\s*$',
              r'\1true',
              content
          )

          if count == 0 and not re.search(
              r'(?m)^\s*gradle_build/use_gradle_build\s*=\s*true\s*$',
              content
          ):
              raise SystemExit("ERRO: configuração Use Gradle Build não encontrada")

          path.write_text(content, encoding="utf-8")
          print("Use Gradle Build ativado com sucesso.")
          PY

      - name: Exportar APK com Godot
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: ${{ env.PROJECT_PATH }}

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: TobiEBreu-APK
          path: ${{ env.PROJECT_PATH }}/build/TobiEBreu.apk
          if-no-files-found: error
